version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      # Test infrastructure reads files by t.TempDir()-derived variable paths;
      # reading by variable path IS the tests' purpose. Production code paths
      # remain fully checked.
      - path: _test\.go
        linters: [gosec]
        text: "G304"
      # The cache package's purpose is file IO at variable paths inside the
      # configured cache dir; paths are cacheDir + constant basenames + md5
      # hex — never request/user-controlled content.
      - path: internal/cache/
        linters: [gosec]
        text: "G304"
      # Loading the user's OWN config file at a user-chosen path (env var or
      # ~/.claude/statusline.toml) is the feature; the path author and the
      # file reader are the same local user.
      - path: internal/config/
        linters: [gosec]
        text: "G304"
      # runGit's purpose is executing git with a variable working directory.
      # Arguments are compile-time constants from internal/gitinfo; the dir is
      # the host-provided workspace path. No shell is involved (direct exec).
      - path: main\.go
        linters: [gosec]
        text: "G204"
      # Test infrastructure writes an executable PATH-shim script (a fake
      # `git`) into t.TempDir(); an executable cannot satisfy G306's 0600 —
      # 0o700 is already the minimum (owner-only). Writing 0600 then Chmod
      # 0700 would produce the identical file while dodging the check.
      - path: _test\.go
        linters: [gosec]
        text: "G306"

formatters:
  enable:
    - gofumpt
