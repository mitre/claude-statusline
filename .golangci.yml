version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      # Test infrastructure reads files by t.TempDir()-derived variable paths;
      # reading by variable path IS the tests' purpose. Production code paths
      # remain fully checked.
      - path: _test\.go
        linters: [gosec]
        text: "G304"
      # Script-behavior tests exec repo shell scripts (constant paths) with
      # t.TempDir()-derived fixture arguments; executing with variable test
      # paths IS the tests' purpose — same class as the G304 test exclusion.
      # Production subprocess calls remain fully checked (main.go G204 is a
      # separate, individually justified entry below).
      - path: _test\.go
        linters: [gosec]
        text: "G204"
      # The cache package's purpose is file IO at variable paths inside the
      # configured cache dir; paths are cacheDir + constant basenames + md5
      # hex — never request/user-controlled content.
      - path: internal/cache/
        linters: [gosec]
        text: "G304"
      # Loading the user's OWN config file at a user-chosen path (env var or
      # ~/.claude/statusline.toml) is the feature; the path author and the
      # file reader are the same local user.
      - path: internal/config/
        linters: [gosec]
        text: "G304"
      # gitinfo's lock-badge discovery opens the repo-layout ".git" pointer
      # file — a fixed basename joined to ancestors of the host-provided
      # workspace path, read bounded to 8 KiB. Resolving its "gitdir:"
      # indirection IS the feature; the content is never executed or
      # emitted, it only selects which index.lock gets stat()ed.
      - path: internal/gitinfo/
        linters: [gosec]
        text: "G304"
      # Two direct execs, no shell anywhere. runGit executes git with a
      # variable working directory: arguments are compile-time constants from
      # internal/gitinfo; the dir is the host-provided workspace path.
      # keychainCredentialJSON passes the keychain service and account names
      # Claude Code derives from the environment; each is checked against its
      # exact ported pattern (keychainServicePattern, keychainAccountPattern)
      # before the exec and refused otherwise.
      - path: main\.go
        linters: [gosec]
        text: "G204"
      # Test infrastructure writes an executable PATH-shim script (a fake
      # `git`) into t.TempDir(); an executable cannot satisfy G306's 0600 —
      # 0o700 is already the minimum (owner-only). Writing 0600 then Chmod
      # 0700 would produce the identical file while dodging the check.
      - path: _test\.go
        linters: [gosec]
        text: "G306"
      # Taint-analysis twin of the G304 test exclusion above: tests copy
      # repo fixture content (testdata/) into t.TempDir()-derived paths;
      # writing fixtures at variable temp paths IS the tests' purpose.
      # Production write paths remain fully checked.
      - path: _test\.go
        linters: [gosec]
        text: "G703"
      # The fetch gate's directory is created when a render first takes the
      # fetch lock. Its path comes from os.UserCacheDir or the [cache] dir
      # setting; the only taint source gosec finds is the separate-process
      # test helper's USAGE_HELPER_DIR variable, which reaches this call
      # through Resolve (lint with --tests=false reports nothing). Only this
      # one call is excluded; every other path in the file stays checked.
      - path: internal/usage/usage\.go
        linters: [gosec]
        text: "G703"
        source: 'os\.MkdirAll\(dir, 0o700\)'

formatters:
  enable:
    - gofumpt
