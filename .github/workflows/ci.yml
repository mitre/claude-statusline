# CI mirrors local development exactly: every gate is a make target, so the
# command CI runs is the command a developer runs. No duplicated shell here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint + vuln + race + cover + cross-build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pinned to the same version the repo is linted with locally.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Pinned to the same version the release workflow uses.
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.0
      - run: make lint
      - run: make vuln
      - run: make race
      - run: make cover
      # Snapshot build: the multi-platform compile check plus a full dry run
      # of the release pipeline (archives + checksums) — publishes nothing.
      - run: make snapshot
# The macOS byte-parity job was retired 2026-07-03 alongside the parity make
# target: the first intentional display change (account row) ended the
# byte-parity era. Go golden tests are the display spec of record.
