# CI mirrors local development exactly: every gate is a make target, so the
# command CI runs is the command a developer runs. No duplicated shell here.
name: CI

# Triggers: exactly one authoritative run per SHA. PR branches run via
# pull_request only (an unfiltered push trigger doubled every PR run);
# tags get no CI here — the release workflow runs its own gates job on
# the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes cancel their in-flight run; main pushes queue —
# cancel-in-progress on main killed 9 of the last 40 main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: lint + vuln + race + cover + cross-build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Every tool version is pinned in the Makefile (the single source);
      # the make targets refuse a mismatched binary.
      - name: Install pinned tools
        run: make tools
      - run: make lint
      - run: make vuln
      - run: make race
      - run: make cover
      # Snapshot build: the multi-platform compile check plus a full dry run
      # of the release pipeline (archives + checksums) — publishes nothing.
      - run: make snapshot
# No macOS job: the Go golden tests are the display spec of record and are
# platform-neutral — the linux runner covers every gate. (Provenance of the
# retired byte-parity era lives in README §Design notes.)
