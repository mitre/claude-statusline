# Fires ONLY on version tags. Runs the same make target a developer runs —
# no CI-only shell (repo convention, same as ci.yml). The first real run
# happens when the publish card (claude-statusline-60g.9) pushes v0.1.0.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full local gate (lint + vuln + race + cover + build) must pass on the
  # tagged commit before anything publishes — a tag on a red commit stops here.
  gates:
    name: make check (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Every tool version is pinned in the Makefile (the single source).
      - name: Install pinned tools
        run: make tools
      - run: make check

  release:
    name: goreleaser (archives + checksums)
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # goreleaser derives versions/changelog from git history — full clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Every tool version is pinned in the Makefile (the single source).
      - name: Install pinned tools
        run: make tools
      # Short-lived installation token (1h) from the org's mitre-tap-publisher
      # app — scoped to Contents-write on mitre/homebrew-tap only. goreleaser
      # uses it to push the generated formula into the tap.
      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TAP_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAP_PUBLISHER_APP_PRIVATE_KEY }}
          owner: mitre
          repositories: homebrew-tap
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Formula rendered from this release's checksums and pushed to the
      # tap by our own tested scripts (goreleaser's brews is deprecated and
      # homebrew_casks is macOS-only + signed-binaries — see .goreleaser.yaml).
      - run: make publish-formula
        env:
          VERSION: ${{ github.ref_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
