# claude-statusline configuration
#
# Copy to ~/.claude/statusline.toml (or point $CLAUDE_STATUSLINE_CONFIG at it).
# Every key is optional — a missing file or missing key keeps the default
# shown below. Zero config renders the default layout:
#
#   model    Fable 5 1M · Sub · session 0a1b2c3d
#   project  ~/projects/demo-app · ⎇ main ~2
#   context  ▓▓▓░░░░░░░ 30%
#   account  dev@example.com · 5h 5% · week 13%
#   activity 17h23m · +1,598/-8 lines

# Whole rows. A disabled row disappears entirely.
# ("limits" is accepted as a deprecated alias for "account".)
[rows]
model = true
project = true
context = true
account = true
activity = true

# Segments within the model row.
[model]
show_auth = true         # "· Sub" / "· API" badge
show_session = true      # "· session 0a1b2c3d" (first 8 chars of session id)
show_context_size = true # append "1M"/"200k" to the model name

# Segments within the project row.
[project]
show_branch = true # "· ⎇ main"
show_dirty = true  # " ~2" changed-file count (yellow)
tilde_home = true  # shorten $HOME prefix to ~
# Deadline per git read, in milliseconds (governs both engines); a read that
# overruns is abandoned and the cached value is served instead. 0 disables
# the bound entirely.
git_timeout_ms = 150
# Git reader: "auto" (default) reads in-process via go-git — no git binary
# needed — and escalates a repo to the git CLI when the in-process read
# overruns git_timeout_ms (the CLI's fsmonitor daemon stays fast on huge
# repos; see the README design notes). "gogit" or "cli" force one engine.
git_engine = "auto"

# Account-scope meters row (Sub auth only).
[account]
# Logged-in account email as the row's first segment — names whose pools
# the meters describe. Read from ~/.claude.json; omitted when absent.
show_email = true
# "normal" (default): regular weight. "dim": fade it into the furniture
# tier with the session id and reset labels.
email_style = "normal"
# "always" (default): reset times shown on every meter.
# "quiet": reset times appear only once a window is running hot (>=80%) —
#          quiet is NOT never.
show_resets = "always"

# Usage-endpoint fetching for the account row.
[usage]
enabled = true     # set false to skip the usage endpoint entirely
ttl_seconds = 180  # how long a fetched payload is served before re-fetching

# Cache location. Defaults to the platform user-cache dir (on macOS:
# /Users/you/Library/Caches/claude-statusline); set an ABSOLUTE path to
# override — "~" is not expanded. Caches are disposable: deleting the
# directory costs one cold render.
[cache]
# dir = "/absolute/path/to/cache"
